[package]
name = "dragonbones-bevy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Bevy adapter for the DragonBones runtime reimplementation"
repository.workspace = true

[dependencies]
dragonbones-core = { path = "../dragonbones-core" }
bevy = { version = "0.20", default-features = false, features = ["2d", "png"] }
serde_json = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[lib]
bench = false

[[bench]]
name = "sync"
harness = false
