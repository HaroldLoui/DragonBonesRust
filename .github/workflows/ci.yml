name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing/audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev             libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux windowing/audio dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev             libx11-dev libxcursor-dev libxi-dev libxrandr-dev
      - run: cargo test --workspace
